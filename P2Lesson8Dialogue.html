<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="author" content="Franky Laoshi">
<title>第八课《感谢我周围的人》- 超级英雄课堂对话剧场 | Franky Laoshi</title>
<style>
  :root {
    --comic-blue: #1976d2;
    --comic-yellow: #ffd600;
    --comic-red: #ff1744;
    --comic-green: #00c853;
    --comic-cream: #fffde7;
    --ink: #1a1a1a;
  }

  * {
    box-sizing: border-box;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    background-color: #29b6f6;
    background-image:
      radial-gradient(#0288d1 2px, transparent 2px),
      radial-gradient(#81d4fa 2px, #29b6f6 2px);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 全局隐藏英文控制 */
  body.hide-english .en-text {
    display: none !important;
  }

  /* 拼音注音排版 */
  ruby { ruby-align: center; }
  rt { font-size: 0.56em; color: #37474f; font-weight: 700; letter-spacing: 0; }

  header {
    position: relative;
    width: 100%;
    background: linear-gradient(135deg, #d50000 0%, #ff1744 50%, #ff5252 100%);
    color: white;
    padding: 14px 16px;
    text-align: center;
    border-bottom: 5px solid var(--ink);
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.22rem, 3.2vw, 1.75rem);
    line-height: 1.95;
    text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink);
  }
  header rt { color: #fff59d; text-shadow: 1px 1px 0 var(--ink); }
  .subtitle-badge {
    display: inline-block;
    background: var(--comic-yellow);
    color: var(--ink);
    font-weight: 900;
    font-size: clamp(0.75rem, 2vw, 0.88rem);
    padding: 4px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
    margin-top: 4px;
  }

  /* =========================================================
     个人专属防伪徽章：Franky Laoshi（美漫贴纸印章风）
     ========================================================= */
  .author-stamp {
    position: absolute;
    top: 14px;
    right: 20px;
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: var(--comic-yellow);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 5px 14px;
    font-size: 0.86rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(3deg);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 20;
    transition: transform 0.2s ease;
  }
  .author-stamp:hover {
    transform: rotate(0deg) scale(1.06);
  }
  .author-stamp .stamp-sub {
    background: var(--comic-yellow);
    color: var(--ink);
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1.5px solid var(--ink);
  }

  @media (max-width: 860px) {
    .author-stamp {
      position: static;
      margin-top: 8px;
      transform: rotate(0deg);
    }
  }

  .container {
    position: relative;
    width: 95%;
    max-width: 1060px;
    background: var(--comic-cream);
    border: 5px solid var(--ink);
    border-radius: 24px;
    margin: 16px auto;
    padding: clamp(14px, 2.5vw, 22px);
    box-shadow: 8px 8px 0 var(--ink);
    text-align: center;
    overflow: hidden;
  }

  /* 画布右下角半透明防伪暗纹 */
  .container::after {
    content: "🦸‍♂️ FRANKY LAOSHI";
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: rgba(26, 26, 26, 0.16);
    pointer-events: none;
  }

  /* 顶部控制栏 */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 3px dashed #bdbdbd;
  }

  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .comic-btn {
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 8px 13px;
    font-size: clamp(0.86rem, 1.8vw, 0.95rem);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
  }
  .comic-btn span.btn-en { font-size: 0.72rem; font-weight: 600; opacity: 0.9; margin-top: 2px; }
  .comic-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .comic-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

  .btn-tab { background: var(--comic-yellow); color: var(--ink); }
  .btn-tab.active { background: var(--comic-red); color: white; }

  .control-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .pill-btn {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: clamp(0.8rem, 1.7vw, 0.86rem);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    white-space: nowrap;
  }
  .pill-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .pill-btn.active { background: var(--comic-green); color: white; }
  .pill-btn.en-toggle-btn { background: #e1f5fe; color: #01579b; }
  .pill-btn.en-toggle-btn.off { background: #eceff1; color: #546e7a; }

  /* 课堂小组积分板 */
  .scoreboard {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: #e1f5fe;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 10px 14px;
    margin-bottom: 16px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .team-box {
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    padding: 6px 14px;
    border-radius: 12px;
    border: 3px solid var(--ink);
  }
  .score-num { font-size: clamp(1.3rem, 2.6vw, 1.55rem); color: var(--comic-red); min-width: 26px; }
  .score-btn {
    background: var(--comic-green);
    color: white;
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* 漫画情景剧场舞台 */
  .comic-stage {
    background: linear-gradient(180deg, #e3f2fd 0%, #fff9c4 65%, #c8e6c9 100%);
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: clamp(14px, 2.5vw, 22px);
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 18px;
  }

  .hero-showcase {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
  }
  .hero-illustration-frame {
    width: clamp(128px, 22vw, 156px);
    height: clamp(128px, 22vw, 156px);
    background: radial-gradient(circle, #ffffff 40%, #bbdefb 100%);
    border: 5px solid var(--ink);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 10px;
    overflow: hidden;
    padding: 6px;
  }
  .hero-illustration-frame svg {
    width: 100%;
    height: 100%;
  }
  .hero-clue-tag {
    background: var(--comic-blue);
    color: white;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 5px 16px;
    font-size: clamp(0.86rem, 2vw, 0.95rem);
    font-weight: 800;
    line-height: 1.7;
    box-shadow: 3px 3px 0 var(--ink);
    max-width: 100%;
  }

  /* 对话气泡双栏 */
  .dialogue-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 16px;
    margin-top: 10px;
  }
  .bubble-card {
    background: white;
    border: 4px solid var(--ink);
    border-radius: 20px;
    padding: clamp(14px, 2.2vw, 18px);
    box-shadow: 5px 5px 0 var(--ink);
    text-align: left;
    position: relative;
  }
  .role-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 900;
    margin-bottom: 10px;
  }
  .role-a { background: #bbdefb; }
  .role-b { background: #ffecb3; }

  .sentence-cn {
    font-size: clamp(1.25rem, 2.8vw, 1.5rem);
    font-weight: 900;
    line-height: 2.25;
    color: var(--ink);
    word-break: break-word;
  }
  .sentence-en {
    font-size: clamp(0.86rem, 1.8vw, 0.95rem);
    color: #546e7a;
    font-weight: 700;
    margin-top: 6px;
  }

  /* 遮罩/答案揭示样式 */
  .blank-box {
    display: inline-block;
    min-width: clamp(78px, 16vw, 110px);
    padding: 0 8px;
    border-bottom: 4px dashed var(--comic-red);
    color: var(--comic-red);
    text-align: center;
    background: #fff3e0;
    border-radius: 8px 8px 0 0;
  }
  .blank-box.revealed {
    border-bottom: 4px solid var(--comic-green);
    color: #1b5e20;
    background: #e8f5e9;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .mini-btn {
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: clamp(0.82rem, 1.8vw, 0.88rem);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    background: #f5f5f5;
  }
  .mini-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .mini-speak { background: #ff7043; color: white; }
  .mini-reveal { background: var(--comic-yellow); color: var(--ink); }

  /* 选项卡片网格 */
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .option-card {
    background: white;
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 12px 8px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .option-card:hover { transform: translateY(-4px); background: #e3f2fd; }
  .option-card .opt-art {
    width: clamp(88px, 18vw, 105px);
    height: clamp(88px, 18vw, 105px);
    background: #fffde7;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 8px;
  }
  .option-card .opt-art svg { width: 100%; height: 100%; }
  .option-card .opt-ruby { font-size: clamp(1.15rem, 2.4vw, 1.35rem); font-weight: 900; line-height: 1.9; }
  .option-card .opt-en { font-size: 0.82rem; color: #607d8b; font-weight: 700; }
  .option-card.correct { background: #b9f6ca !important; animation: pop 0.4s; }
  .option-card.wrong { background: #ff8a80 !important; animation: shake 0.4s; }

  /* 高清 SVG 幸运大转盘 */
  .wheel-wrapper {
    position: relative;
    width: min(380px, 76vw);
    height: min(380px, 76vw);
    margin: 26px auto 14px;
  }
  .wheel-pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid var(--comic-red);
    filter: drop-shadow(0 3px 0 var(--ink));
    z-index: 10;
  }
  .wheel-svg-box {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid var(--ink);
    box-shadow: 0 0 0 5px var(--comic-yellow), 0 8px 0 var(--ink);
    overflow: hidden;
    background: white;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .wheel-center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(62px, 15vw, 76px);
    height: clamp(62px, 15vw, 76px);
    border-radius: 50%;
    background: var(--comic-red);
    color: white;
    border: 4px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    font-weight: 900;
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    cursor: pointer;
    z-index: 5;
  }
  .wheel-center-btn:active {
    transform: translate(-50%, -46%);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* 底部大控制按钮 */
  .bottom-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .next-btn {
    background: var(--comic-green);
    color: white;
    font-size: clamp(1rem, 2.2vw, 1.12rem);
    padding: 10px 22px;
  }

  /* 手机竖屏专属网格与间距优化 */
  @media (max-width: 640px) {
    .top-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .control-group {
      justify-content: center;
    }
    .options-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .bottom-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .bottom-controls .next-btn {
      grid-column: span 2;
    }
  }

  /* 彩带 */
  .confetti {
    position: fixed;
    width: 11px;
    height: 11px;
    border: 2px solid var(--ink);
    top: -20px;
    z-index: 9999;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  @keyframes pop { 50% { transform: scale(1.06); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>

<header>
  <h1>
    🦸‍♂️ <ruby>第<rt>dì</rt>八<rt>bā</rt>课<rt>kè</rt></ruby>《<ruby>感<rt>gǎn</rt>谢<rt>xiè</rt>我<rt>wǒ</rt>周<rt>zhōu</rt>围<rt>wéi</rt>的<rt>de</rt>人<rt>rén</rt></ruby>》<ruby>课<rt>kè</rt>堂<rt>táng</rt>对<rt>duì</rt>话<rt>huà</rt>剧<rt>jù</rt>场<rt>chǎng</rt></ruby>
  </h1>
  <div class="subtitle-badge en-text">⚡ SUPERHERO COMMUNITY DIALOGUE &amp; LUCKY WHEEL ⚡</div>

  <!-- 个人专属美漫防伪徽章 -->
  <div class="author-stamp" title="Original Classroom Design by Franky Laoshi">
    <span>⚡ Franky Laoshi</span>
    <span class="stamp-sub">ORIGINAL</span>
  </div>
</header>

<div class="container">
  <!-- 顶部模式与语速/英文开关控制 -->
  <div class="top-bar">
    <div class="mode-tabs">
      <button class="comic-btn btn-tab active" id="tab-dialogue" onclick="switchMode('dialogue')">
        <span>🎭 1. 公园情景剧场</span>
        <span class="btn-en en-text">Role-Play Dialogue</span>
      </button>
      <button class="comic-btn btn-tab" id="tab-guess" onclick="switchMode('guess')">
        <span>🕵️ 2. 英雄身份猜猜猜</span>
        <span class="btn-en en-text">Guess the Hero</span>
      </button>
      <button class="comic-btn btn-tab" id="tab-wheel" onclick="switchMode('wheel')">
        <span>🎡 3. 幸运大转盘</span>
        <span class="btn-en en-text">Lucky Wheel Spin</span>
      </button>
      <button class="comic-btn btn-tab" id="tab-list" onclick="switchMode('list')">
        <span>📖 4. 句型总览表</span>
        <span class="btn-en en-text">All 10 Heroes</span>
      </button>
    </div>

    <div class="control-group">
      <button class="pill-btn en-toggle-btn" id="btn-toggle-en" onclick="toggleEnglish()">
        👁️ 隐藏英文 (Hide EN)
      </button>
      <button class="pill-btn active" id="speed-slow" onclick="setSpeed(0.60)">🐢 慢速 <span class="en-text">(Slow)</span></button>
      <button class="pill-btn" id="speed-normal" onclick="setSpeed(0.85)">🐇 正常 <span class="en-text">(Normal)</span></button>
    </div>
  </div>

  <!-- 课堂小组积分板 -->
  <div class="scoreboard">
    <div class="team-box">
      <span>🔴 <ruby>红<rt>hóng</rt>队<rt>duì</rt></ruby> <span class="en-text">(Red Team)</span>:</span>
      <span class="score-num" id="score-red">0</span>
      <button class="score-btn" onclick="addScore('red', 1)">+1 ⭐</button>
    </div>
    <div class="team-box">
      <span>🔵 <ruby>蓝<rt>lán</rt>队<rt>duì</rt></ruby> <span class="en-text">(Blue Team)</span>:</span>
      <span class="score-num" id="score-blue">0</span>
      <button class="score-btn" onclick="addScore('blue', 1)">+1 ⭐</button>
    </div>
  </div>

  <!-- 主舞台区域 -->
  <div id="main-area"></div>
</div>

<script>
// 10个专属高清美漫风格矢量插画 SVG 库
const heroSVGs = {
  1: `<svg viewBox="0 0 120 120">

  2: `<svg viewBox="0 0 120 120">

let currentMode = 'dialogue';
let currentIndex = 4;
let speechRate = 0.60;
let scores = { red: 0, blue: 0 };
let isRevealed = false;
let showEnglish = true;
let wheelRotation = 0;
let isSpinning = false;

function toggleEnglish() {
  showEnglish = !showEnglish;
  document.body.classList.toggle('hide-english', !showEnglish);
  const btn = document.getElementById('btn-toggle-en');
  if (showEnglish) {
    btn.innerHTML = "👁️ 隐藏英文 (Hide EN)";
    btn.classList.remove('off');
  } else {
    btn.innerHTML = "🙈 显示英文 (Show EN)";
    btn.classList.add('off');
  }
}

function setSpeed(rate) {
  speechRate = rate;
  document.getElementById('speed-slow').classList.toggle('active', rate === 0.60);
  document.getElementById('speed-normal').classList.toggle('active', rate === 0.85);
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = speechRate;
    window.speechSynthesis.speak(utter);
  }
}

function addScore(team, pts) {
  scores[team] += pts;
  document.getElementById(`score-${team}`).innerText = scores[team];
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#ff1744', '#ffd600', '#00c853', '#29b6f6', '#aa00ff'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (Math.random() * 1.1 + 0.9) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${mode}`).classList.add('active');

  if (mode === 'dialogue') renderDialogueMode();
  else if (mode === 'guess') renderGuessMode();
  else if (mode === 'wheel') renderWheelMode();
  else if (mode === 'list') renderListMode();
}

  isRevealed = false;

  const area = document.getElementById('main-area');

  area.innerHTML = `
    <div class="comic-stage">
      <div class="hero-showcase">
        <div class="hero-illustration-frame">${heroSVGs[item.id]}</div>
        <div class="hero-clue-tag">
          🗣️ <ruby>请<rt>qǐng</rt>两<rt>liǎng</rt>位<rt>wèi</rt>同<rt>tóng</rt>学<rt>xué</rt>看<rt>kàn</rt>图<rt>tú</rt>对<rt>duì</rt>话<rt>huà</rt>！</ruby>
          <span class="en-text">(Pair Dialogue Practice)</span>
        </div>
      </div>

      <div class="dialogue-grid">
        <div class="bubble-card">
          <div class="role-badge role-a">👦 <ruby>同<rt>tóng</rt>学<rt>xué</rt></ruby> A <span class="en-text">(Ask)</span></div>
          <div class="sentence-cn">
            “<ruby>他<rt>tā</rt>是<rt>shì</rt>做<rt>zuò</rt>什<rt>shén</rt>么<rt>me</rt>工<rt>gōng</rt>作<rt>zuò</rt>的<rt>de</rt>？</ruby>”
          </div>
          <div class="sentence-en en-text">“What job does he/she do?”</div>
          <div class="card-actions">
            <button class="mini-btn mini-speak" onclick="speak('他是做什么工作的？')">
              🔊 <ruby>听<rt>tīng</rt>问<rt>wèn</rt>句<rt>jù</rt></ruby> <span class="en-text">(Listen Q)</span>
            </button>
          </div>
        </div>

        <div class="bubble-card">
          <div class="role-badge role-b">👧 <ruby>同<rt>tóng</rt>学<rt>xué</rt></ruby> B <span class="en-text">(Answer)</span></div>
          <div class="sentence-cn">
            “<ruby>他<rt>tā</rt>是<rt>shì</rt></ruby> <span class="blank-box" id="slot-job">？</span>，
            <ruby>他<rt>tā</rt>会<rt>huì</rt></ruby> <span class="blank-box" id="slot-action">？</span>。”
          </div>
          <div class="sentence-en en-text" id="slot-en">“He/She is a ______, he/she can ______.”</div>
          <div class="card-actions">
            <button class="mini-btn mini-reveal" onclick="revealDialogueAnswer()">
              👀 <ruby>揭<rt>jiē</rt>晓<rt>xiǎo</rt>答<rt>dá</rt>案<rt>àn</rt></ruby> <span class="en-text">(Show Answer)</span>
            </button>
            <button class="mini-btn mini-speak" onclick="speak('他是' + lessonData[currentIndex].jobPlain + '，他会' + lessonData[currentIndex].actionPlain + '。')">
              🔊 <ruby>听<rt>tīng</rt>答<rt>dá</rt>句<rt>jù</rt></ruby> <span class="en-text">(Listen A)</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-controls">
      <button class="comic-btn" style="background:white;" onclick="prevHero()">
        <span>⬅️ 上一位英雄</span>
        <span class="btn-en en-text">Previous Hero</span>
      </button>
      <button class="comic-btn" style="background:var(--comic-yellow);" onclick="randomHero()">
        <span>🎲 随机抽一位</span>
        <span class="btn-en en-text">Random Hero</span>
      </button>
      <button class="comic-btn next-btn" onclick="nextHero()">
        <span>下一位英雄 ➡️</span>
        <span class="btn-en en-text">Next Hero</span>
      </button>

  `;
}

function revealDialogueAnswer() {
  const item = lessonData[currentIndex];
  const slotJob = document.getElementById('slot-job');
  const slotAction = document.getElementById('slot-action');
  const slotEn = document.getElementById('slot-en');

  slotJob.innerHTML = item.jobRuby;
  slotJob.classList.add('revealed');
  slotAction.innerHTML = item.actionRuby;
  slotAction.classList.add('revealed');
  slotEn.innerText = `“He/She is a ${item.jobEn}, he/she can ${item.actionEn}.”`;

  speak(`他是${item.jobPlain}，他会${item.actionPlain}。`);
  if (!isRevealed) {
    launchConfetti();
    isRevealed = true;
  }
}

function prevHero() {
  currentIndex = (currentIndex - 1 + lessonData.length) % lessonData.length;
  renderDialogueMode();
}

function nextHero() {
  currentIndex = (currentIndex + 1) % lessonData.length;
  renderDialogueMode();
}

function randomHero() {
  let nextIdx = currentIndex;
  while (nextIdx === currentIndex) {
    nextIdx = Math.floor(Math.random() * lessonData.length);
  }
  currentIndex = nextIdx;
  renderDialogueMode();
  speak("他是做什么工作的？");
}

/* 模式 2：英雄身份猜猜猜 */
let guessTarget = null;

function renderGuessMode() {
  guessTarget = lessonData[Math.floor(Math.random() * lessonData.length)];
  let options = [guessTarget];
  while (options.length < 4) {
    let r = lessonData[Math.floor(Math.random() * lessonData.length)];
    if (!options.includes(r)) options.push(r);
  }
  options.sort(() => Math.random() - 0.5);

  const area = document.getElementById('main-area');
  area.innerHTML = `
    <div class="comic-stage">
      <div class="hero-showcase">
        <div class="hero-illustration-frame" id="guess-avatar" style="background:#fff59d; font-size:4.2rem; font-weight:900; color:#d50000;">❓</div>
        <div class="hero-clue-tag">
          🕵️ <ruby>英<rt>yīng</rt>雄<rt>xióng</rt>身<rt>shēn</rt>份<rt>fèn</rt>猜<rt>cāi</rt>猜<rt>cāi</rt>猜<rt>cāi</rt></ruby> <span class="en-text">(Who Am I?)</span>
        </div>
      </div>

      <div class="bubble-card" style="max-width:760px; margin:0 auto; text-align:center;">
        <div class="role-badge role-b">📢 <ruby>英<rt>yīng</rt>雄<rt>xióng</rt>线<rt>xiàn</rt>索<rt>suǒ</rt></ruby> <span class="en-text">(Hero Clue)</span></div>
        <div class="sentence-cn">“${guessTarget.clueRuby}”</div>
        <div class="sentence-en en-text">“${guessTarget.clueEn}”</div>
        <div style="margin-top:10px; font-weight:900; color:#d50000; font-size:clamp(0.95rem, 2.2vw, 1.1rem); line-height:1.9;">
          👉 <ruby>请<rt>qǐng</rt>大<rt>dà</rt>声<rt>shēng</rt>说<rt>shuō</rt>出<rt>chū</rt>完整句子</ruby>：“<ruby>他<rt>tā</rt>是<rt>shì</rt>……，他<rt>tā</rt>会<rt>huì</rt>……！</ruby>”
        </div>
        <div class="card-actions" style="justify-content:center;">
          <button class="mini-btn mini-speak" onclick="speak(guessTarget.cluePlain + ' 他是做什么工作的？')">
            🔊 <ruby>再<rt>zài</rt>听<rt>tīng</rt>一<rt>yī</rt>遍<rt>biàn</rt>线<rt>xiàn</rt>索<rt>suǒ</rt></ruby> <span class="en-text">(Listen Clue)</span>
          </button>
        </div>
      </div>

      <div class="options-grid" id="guess-options"></div>
      <div id="guess-feedback" style="margin-top:16px; font-size:clamp(1.05rem, 2.4vw, 1.3rem); font-weight:900; line-height:1.9;"></div>
    </div>

    <div class="bottom-controls">
      <button class="comic-btn next-btn" onclick="renderGuessMode()">
        <span>🔄 下一位神秘英雄</span>
        <span class="btn-en en-text">Next Mystery Hero</span>
      </button>
    </div>
  `;

  speak(guessTarget.cluePlain);

  const grid = document.getElementById('guess-options');
  options.forEach(opt => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = `
      <div class="opt-art">${heroSVGs[opt.id]}</div>
      <div class="opt-ruby">${opt.jobRuby}</div>
      <div class="opt-en en-text">${opt.jobEn}</div>
    `;
    card.onclick = () => checkGuess(card, opt);
    grid.appendChild(card);
  });
}

function checkGuess(card, opt) {
  const fb = document.getElementById('guess-feedback');
  if (opt.id === guessTarget.id) {
    card.classList.add('correct');
    const avatar = document.getElementById('guess-avatar');
    avatar.innerHTML = heroSVGs[opt.id];
    avatar.style.background = '#b9f6ca';
    launchConfetti();
    fb.innerHTML = `
      🎉 <ruby>答<rt>dá</rt>对<rt>duì</rt>了<rt>le</rt>！全<rt>quán</rt>班<rt>bān</rt>一<rt>yī</rt>起<rt>qǐ</rt>说<rt>shuō</rt></ruby>：
      “<ruby>他<rt>tā</rt>是<rt>shì</rt></ruby>${opt.jobRuby}，<ruby>他<rt>tā</rt>会<rt>huì</rt></ruby>${opt.actionRuby}！”
      <div class="en-text" style="font-size:0.92rem; color:#37474f;">Correct! “He/She is a ${opt.jobEn}, he/she can ${opt.actionEn}.”</div>
    `;
    speak(`答对了！他是${opt.jobPlain}，他会${opt.actionPlain}！`);
  } else {
    card.classList.add('wrong');
    fb.innerHTML = `
      🤔 <ruby>再<rt>zài</rt>猜<rt>cāi</rt>一<rt>yī</rt>猜<rt>cāi</rt>！这<rt>zhè</rt>位<rt>wèi</rt>是<rt>shì</rt></ruby>${opt.jobRuby}（<ruby>他<rt>tā</rt>会<rt>huì</rt></ruby>${opt.actionRuby}）。
    `;
    speak(`这是${opt.jobPlain}，他会${opt.actionPlain}，再猜一次吧！`);
  }
}

/* 模式 3：纯图片高清 SVG 幸运大转盘 */
function renderWheelMode() {
  isSpinning = false;
  const area = document.getElementById('main-area');
  const n = lessonData.length;
  const sliceAngle = 360 / n;
  const cx = 190, cy = 190, r = 190;
  const sliceColors = ['#fff9c4', '#bbdefb', '#c8e6c9', '#ffe0b2', '#f8bbd0'];

  let pathsHtml = '';
  lessonData.forEach((item, i) => {
    const startDeg = i * sliceAngle - 90;
    const endDeg = (i + 1) * sliceAngle - 90;
    const midDeg = startDeg + sliceAngle / 2;

    const startRad = (startDeg * Math.PI) / 180;
    const endRad = (endDeg * Math.PI) / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);

    const color = sliceColors[i % sliceColors.length];
    const imgRad = (midDeg * Math.PI) / 180;
    const ix = cx + (r * 0.67) * Math.cos(imgRad);
    const iy = cy + (r * 0.67) * Math.sin(imgRad);

    const innerSvgContent = heroSVGs[item.id]
      .replace('<svg viewBox="0 0 120 120">', '')
      .replace('</svg>', '');

    pathsHtml += `
      <path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z"
            fill="${color}" stroke="#1a1a1a" stroke-width="2.5" />
      <g transform="translate(${ix}, ${iy}) rotate(${midDeg + 90})">
        <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
        <g transform="translate(-24, -24) scale(0.4)">
          ${innerSvgContent}
        </g>
      </g>
    `;
  });

  area.innerHTML = `
    <div class="comic-stage">
      <div class="hero-clue-tag" style="display:inline-block; background:var(--comic-yellow); color:var(--ink);">
        🎡 <ruby>幸<rt>xìng</rt>运<rt>yùn</rt>大<rt>dà</rt>转<rt>zhuǎn</rt>盘<rt>pán</rt>：点<rt>diǎn</rt>击<rt>jī</rt>转<rt>zhuǎn</rt>盘<rt>pán</rt>，看<rt>kàn</rt>图<rt>tú</rt>说<rt>shuō</rt>出<rt>chū</rt>英<rt>yīng</rt>雄<rt>xióng</rt>身<rt>shēn</rt>份<rt>fèn</rt>！</ruby>
        <span class="en-text">(Spin &amp; Name the Hero!)</span>
      </div>

      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <div class="wheel-svg-box" id="wheel-spinner" style="transform: rotate(${wheelRotation}deg);">
          <svg viewBox="0 0 380 380" width="100%" height="100%">
            ${pathsHtml}
          </svg>
        </div>
        <button class="wheel-center-btn" onclick="spinWheel()">GO!</button>
      </div>

      <div id="wheel-result" style="margin-top:16px;"></div>
    </div>
  `;
}

function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('wheel-result').innerHTML = '';

  const n = lessonData.length;
  const sliceAngle = 360 / n;
  const chosenIndex = Math.floor(Math.random() * n);

  const targetAngle = 360 - (chosenIndex * sliceAngle + sliceAngle / 2);
  const currentMod = ((wheelRotation % 360) + 360) % 360;
  let delta = targetAngle - currentMod;
  if (delta < 0) delta += 360;

  wheelRotation += 5 * 360 + delta;
  const spinner = document.getElementById('wheel-spinner');
  spinner.style.transform = `rotate(${wheelRotation}deg)`;

  setTimeout(() => {
    isSpinning = false;
    currentIndex = chosenIndex;
    const item = lessonData[chosenIndex];
    launchConfetti();
    speak("他是做什么工作的？");

    document.getElementById('wheel-result').innerHTML = `
      <div class="bubble-card" style="max-width:680px; margin:0 auto; text-align:center; animation:pop 0.4s;">
        <div style="width:120px; height:120px; margin:0 auto 10px; border:4px solid #1a1a1a; border-radius:22px; background:#fffde7; padding:6px; box-shadow:4px 4px 0 #1a1a1a;">
          ${heroSVGs[item.id]}
        </div>
        <div class="sentence-cn" style="font-size:clamp(1.25rem, 2.8vw, 1.5rem); color:#0d47a1;">
          🗣️ “<ruby>他<rt>tā</rt>是<rt>shì</rt>做<rt>zuò</rt>什<rt>shén</rt>么<rt>me</rt>工<rt>gōng</rt>作<rt>zuò</rt>的<rt>de</rt>？</ruby>”
        </div>
        <div class="sentence-en en-text">“What job does he/she do?”</div>

        <div id="wheel-answer-box" style="margin-top:10px;">
          <button class="mini-btn mini-reveal" style="font-size:1rem; padding:8px 18px;" onclick="revealWheelAnswer(${chosenIndex})">
            👀 <ruby>揭<rt>jiē</rt>晓<rt>xiǎo</rt>答<rt>dá</rt>案<rt>àn</rt></ruby> <span class="en-text">(Show Answer)</span>
          </button>
        </div>
      </div>
    `;
  }, 4100);
}

function revealWheelAnswer(idx) {
  const item = lessonData[idx];
  speak(`他是${item.jobPlain}，他会${item.actionPlain}。`);
  document.getElementById('wheel-answer-box').innerHTML = `
    <div class="sentence-cn" style="color:#d50000; font-size:clamp(1.2rem, 2.7vw, 1.45rem); margin-top:6px;">
      “<ruby>他<rt>tā</rt>是<rt>shì</rt></ruby>${item.jobRuby}，<ruby>他<rt>tā</rt>会<rt>huì</rt></ruby>${item.actionRuby}。”
    </div>
    <div class="sentence-en en-text">“He/She is a ${item.jobEn}, he/she can ${item.actionEn}.”</div>
    <div class="card-actions" style="justify-content:center; margin-top:10px;">
      <button class="mini-btn mini-speak" onclick="speak('他是${item.jobPlain}，他会${item.actionPlain}。')">
        🔊 <ruby>再<rt>zài</rt>听<rt>tīng</rt>一<rt>yī</rt>遍<rt>biàn</rt></ruby> <span class="en-text">(Listen Again)</span>
      </button>
    </div>
  `;
}

/* 模式 4：句型总览表 */

  const area = document.getElementById('main-area');
  let cardsHtml = lessonData.map(item => `
    <div class="option-card" style="padding:12px 8px; text-align:center;" onclick="speak('他是${item.jobPlain}，他会${item.actionPlain}。')">
      <div class="opt-art">${heroSVGs[item.id]}</div>
      <div class="opt-ruby">
        <ruby>他<rt>tā</rt>是<rt>shì</rt></ruby>${item.jobRuby}，
      </div>
      <div class="opt-ruby" style="color:#d50000;">
        <ruby>他<rt>tā</rt>会<rt>huì</rt></ruby>${item.actionRuby}。
      </div>
      <div class="opt-en en-text" style="margin-top:6px;">${item.jobEn} · ${item.actionEn}</div>
      <div style="margin-top:8px; font-size:0.78rem; background:#fff9c4; border:2px solid #1a1a1a; border-radius:999px; padding:2px 10px; font-weight:800;">
        🔊 点击朗读 <span class="en-text">(Tap to Read)</span>
      </div>

  `).join('');

  area.innerHTML = `
    <div class="comic-stage">
      <div style="font-size:clamp(1.1rem, 2.5vw, 1.35rem); font-weight:900; margin-bottom:14px; line-height:1.9;">
        📖 <ruby>全<rt>quán</rt>班<rt>bān</rt>带<rt>dài</rt>读<rt>dú</rt>：点<rt>diǎn</rt>击<rt>jī</rt>任<rt>rèn</rt>意<rt>yì</rt>卡<rt>kǎ</rt>片<rt>piàn</rt>听<rt>tīng</rt>完<rt>wán</rt>整<rt>zhěng</rt>句<rt>jù</rt>子<rt>zi</rt></ruby>

        ${cardsHtml}

}

// 默认启动“公园情景剧场”对话练习模式
renderDialogueMode();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第八课《感谢我周围的人》- Superhero Community Adventure | Franky Laoshi</title>
<style>
  :root {
    --comic-blue: #1976d2;
    --comic-sky: #4fc3f7;
    --comic-yellow: #ffd600;
    --comic-red: #ff1744;
    --comic-green: #00c853;
    --comic-cream: #fffde7;
    --ink: #1a1a1a;
  }

  * {
    box-sizing: border-box;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Comic Sans MS", -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    touch-action: manipulation;
  }

  /* 美漫波点背景 */
  body {
    margin: 0;
    padding: 0 0 36px 0;
    background-color: #29b6f6;
    background-image:
      radial-gradient(#0288d1 2px, transparent 2px),
      radial-gradient(#81d4fa 2px, #29b6f6 2px);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* 拼音注音排版 */
  ruby { ruby-align: center; }
  rt { font-size: 0.56em; color: #37474f; font-weight: 600; letter-spacing: 0; }

  /* 顶部漫画横幅 */
  header {
    width: 100%;
    background: linear-gradient(135deg, #d50000 0%, #ff1744 50%, #ff5252 100%);
    color: white;
    padding: 14px 16px;
    text-align: center;
    border-bottom: 5px solid var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    position: relative;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.22rem, 3vw, 1.75rem);
    line-height: 1.9;
    text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
  }
  header rt {
    color: #fff59d;
    text-shadow: 1px 1px 0 var(--ink);
  }
  .subtitle-badge {
    display: inline-block;
    background: var(--comic-yellow);
    color: var(--ink);
    font-weight: 900;
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    padding: 4px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
    margin-top: 6px;
    transform: rotate(-1deg);
    max-width: 95%;
  }

  /* =========================================================
     个人专属防伪徽章：Franky Laoshi（美漫贴纸印章风）
     ========================================================= */
  .author-stamp {
    position: absolute;
    top: 14px;
    right: 20px;
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: var(--comic-yellow);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 5px 14px;
    font-size: 0.85rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(3deg);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 20;
    transition: transform 0.2s ease;
  }
  @media (hover: hover) {
    .author-stamp:hover {
      transform: rotate(0deg) scale(1.06);
    }
  }
  .author-stamp .stamp-sub {
    background: var(--comic-yellow);
    color: var(--ink);
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1.5px solid var(--ink);
  }

  @media (max-width: 860px) {
    .author-stamp {
      position: static;
      margin-top: 8px;
      transform: rotate(0deg);
      font-size: 0.78rem;
      padding: 4px 12px;
    }
  }

  /* 主漫画画板容器 */
  .container {
    width: 94%;
    max-width: 1020px;
    background: var(--comic-cream);
    border: 5px solid var(--ink);
    border-radius: 24px;
    margin: 20px auto;
    padding: 22px;
    box-shadow: 8px 8px 0 var(--ink);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* 画布右下角半透明防伪暗纹 */
  .container::after {
    content: "🦸‍♂️ FRANKY LAOSHI";
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: rgba(26, 26, 26, 0.16);
    pointer-events: none;
  }

  /* 导航与按钮 */
  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 3px dashed #bdbdbd;
  }

  .comic-btn {
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 9px 14px;
    font-size: 0.98rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
  }
  .comic-btn span.btn-en {
    font-size: 0.74rem;
    font-weight: 600;
    opacity: 0.9;
    margin-top: 2px;
  }
  @media (hover: hover) {
    .comic-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--ink);
    }
  }
  .comic-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  .btn-mode { background: #ffffff; color: var(--ink); }
  .btn-mode.active { background: var(--comic-blue); color: white; }

  .btn-game { background: var(--comic-yellow); color: var(--ink); }
  .btn-game.active { background: var(--comic-red); color: white; }

  /* 课堂计分板 */
  .scoreboard {
    display: none;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    background: #e1f5fe;
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 10px 14px;
    margin-bottom: 18px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .team-box {
    font-size: 1.05rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    padding: 6px 14px;
    border-radius: 12px;
    border: 3px solid var(--ink);
  }
  .score-num {
    font-size: 1.6rem;
    color: var(--comic-red);
    min-width: 28px;
  }
  .score-btn {
    background: var(--comic-green);
    color: white;
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .score-btn:active { transform: translate(2px, 2px); box-shadow: none; }

  /* 漫画对话框提示区 */
  .speech-bubble {
    position: relative;
    background: #ffffff;
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: 16px 18px;
    margin-bottom: 22px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 18px 16px 0;
    border-style: solid;
    border-color: var(--ink) transparent transparent;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 14px 12px 0;
    border-style: solid;
    border-color: #ffffff transparent transparent;
    z-index: 1;
  }

  .prompt-text {
    font-size: clamp(1.18rem, 2.8vw, 1.55rem);
    font-weight: 900;
    color: #0d47a1;
    margin: 4px 0 8px;
    line-height: 2.05;
    word-break: break-word;
  }
  .prompt-sub {
    font-size: clamp(0.88rem, 2vw, 1.05rem);
    color: #455a64;
    font-weight: 700;
  }

  .audio-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .speak-btn {
    background: #ff6d00;
    color: white;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .speak-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  .speed-btn {
    background: #f5f5f5;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.86rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .speed-btn.active {
    background: var(--comic-green);
    color: white;
  }

  /* 英雄卡片网格：PC自适应多列，手机端固定双列更易操作 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }

  .card {
    background: #ffffff;
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 14px 8px;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 9px;
    background: linear-gradient(90deg, var(--comic-red), var(--comic-yellow), var(--comic-blue));
    border-bottom: 2px solid var(--ink);
  }
  @media (hover: hover) {
    .card:hover {
      transform: translate(-3px, -4px) rotate(-1deg);
      box-shadow: 8px 8px 0 var(--ink);
      background: #e3f2fd;
    }
  }
  .card:active {
    transform: scale(0.96);
  }
  .card .emoji-badge {
    width: 68px;
    height: 68px;
    background: #fff9c4;
    border: 3px solid var(--ink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    margin: 6px 0 8px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .card .hanzi-ruby {
    font-size: clamp(1.22rem, 2.5vw, 1.48rem);
    font-weight: 900;
    color: var(--ink);
    line-height: 1.9;
  }
  .card .en {
    font-size: 0.8rem;
    color: #546e7a;
    margin-top: 4px;
    font-weight: 700;
  }

  .card.correct {
    background: #b9f6ca !important;
    animation: heroPop 0.5s;
  }
  .card.wrong {
    background: #ff8a80 !important;
    animation: heroShake 0.4s;
  }

  /* 翻翻乐专属卡片 */
  .memory-card {
    height: 138px;
    background: repeating-linear-gradient(
      45deg,
      #1976d2,
      #1976d2 12px,
      #1e88e5 12px,
      #1e88e5 24px
    );
    color: white;
  }
  .memory-card::before { display: none; }
  .memory-card .cover {
    width: 56px; height: 56px;
    background: var(--comic-yellow);
    border: 3px solid var(--ink);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .memory-card .content { display: none; }
  .memory-card.flipped {
    background: #ffffff;
    color: var(--ink);
  }
  .memory-card.flipped .content {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .memory-card.matched {
    background: #b9f6ca;
    opacity: 0.92;
    cursor: default;
  }

  /* 情景剧场专属样式 */
  .theater-stage {
    background: linear-gradient(180deg, #b3e5fc 0%, #c8e6c9 100%);
    border: 4px solid var(--ink);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .dialogue-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    align-items: stretch;
  }
  .dialogue-box {
    flex: 1 1 240px;
    min-width: 0;
    background: white;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 4px 4px 0 var(--ink);
    text-align: left;
  }
  .dialogue-role {
    display: inline-block;
    background: var(--comic-yellow);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 0.82rem;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .dialogue-text {
    font-size: clamp(1.12rem, 2.4vw, 1.35rem);
    font-weight: 900;
    line-height: 2;
  }
  .blank-slot {
    display: inline-block;
    min-width: 82px;
    border-bottom: 4px dashed var(--comic-red);
    color: var(--comic-red);
    text-align: center;
    padding: 0 4px;
  }

  /* 底部反馈栏 */
  .feedback {
    font-size: clamp(1.08rem, 2.5vw, 1.3rem);
    font-weight: 900;
    min-height: 56px;
    margin-top: 18px;
    line-height: 1.7;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: 4px 4px 0 var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .feedback:empty { display: none; }
  .feedback-en {
    display: block;
    font-size: 0.88rem;
    color: #455a64;
    font-weight: 700;
  }

  /* 彩带动画 */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    border: 2px solid var(--ink);
    top: -20px;
    z-index: 9999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); }
  }

  @keyframes heroPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.1) rotate(2deg); }
    100% { transform: scale(1); }
  }
  @keyframes heroShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-2deg); }
    75% { transform: translateX(8px) rotate(2deg); }
  }

  /* ================= 手机端专属适配 (<= 600px) ================= */
  @media (max-width: 600px) {
    .container {
      width: 95%;
      padding: 14px 12px 24px;
      margin: 14px auto;
      border-width: 4px;
      border-radius: 20px;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .nav-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    /* 第5个关卡按钮跨两列居中 */
    #tab-memory {
      grid-column: span 2;
      max-width: 65%;
      justify-self: center;
      width: 100%;
    }
    .comic-btn {
      padding: 8px 8px;
      font-size: 0.88rem;
      box-shadow: 3px 3px 0 var(--ink);
    }
    /* 手机端强制双列卡片网格，避免单列滚动太长 */
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .card {
      padding: 12px 6px;
      border-width: 3px;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .card .emoji-badge {
      width: 56px;
      height: 56px;
      font-size: 2rem;
    }
    .memory-card {
      height: 120px;
    }
    .speech-bubble {
      padding: 12px 12px;
      border-width: 3px;
      box-shadow: 4px 4px 0 var(--ink);
    }
    .speak-btn, .speed-btn {
      padding: 6px 12px;
      font-size: 0.82rem;
    }
  }
</style>
</head>
<body>

<header>
  <h1>
    🦸‍♂️ <ruby>第<rt>dì</rt>八<rt>bā</rt>课<rt>kè</rt></ruby>《<ruby>感<rt>gǎn</rt>谢<rt>xiè</rt>我<rt>wǒ</rt>周<rt>zhōu</rt>围<rt>wéi</rt>的<rt>de</rt>人<rt>rén</rt></ruby>》<ruby>听<rt>tīng</rt>说<rt>shuō</rt>剧<rt>jù</rt>场<rt>chǎng</rt></ruby>
  </h1>
  <div class="subtitle-badge">⚡ SUPERHERO COMMUNITY ADVENTURE · 二年级华文互动游戏 ⚡</div>

  <!-- 个人专属美漫防伪徽章 -->
  <div class="author-stamp" title="Original Classroom Design by Franky Laoshi">
    <span>⚡ Franky Laoshi</span>
    <span class="stamp-sub">ORIGINAL</span>
  </div>
</header>

<div class="container">
  <!-- 模式切换 -->
  <div class="nav-bar">
    <button class="comic-btn btn-mode active" id="mode-home" onclick="setMode('home')">
      <span>🏠 家庭练习模式</span>
      <span class="btn-en">Home Practice Mode</span>
    </button>
    <button class="comic-btn btn-mode" id="mode-class" onclick="setMode('class')">
      <span>🏫 课堂小组竞赛</span>
      <span class="btn-en">Classroom Team Challenge</span>
    </button>
  </div>

  <!-- 课堂记分板 -->
  <div class="scoreboard" id="scoreboard">
    <div class="team-box">
      <span>🔴 <ruby>红<rt>hóng</rt>队<rt>duì</rt></ruby> (Red):</span>
      <span class="score-num" id="score-red">0</span>
      <button class="score-btn" onclick="addScore('red', 1)">+1 ⭐</button>
    </div>
    <div class="team-box">
      <span>🔵 <ruby>蓝<rt>lán</rt>队<rt>duì</rt></ruby> (Blue):</span>
      <span class="score-num" id="score-blue">0</span>
      <button class="score-btn" onclick="addScore('blue', 1)">+1 ⭐</button>
    </div>
  </div>

  <!-- 游戏关卡切换 -->
  <div class="nav-bar">
    <button class="comic-btn btn-game active" id="tab-learn" onclick="switchGame('learn')">
      <span>📖 1. 英雄图鉴</span>
      <span class="btn-en">Hero Cards</span>
    </button>
    <button class="comic-btn btn-game" id="tab-listen" onclick="switchGame('listen')">
      <span>👂 2. 听音找英雄</span>
      <span class="btn-en">Listening</span>
    </button>
    <button class="comic-btn btn-game" id="tab-task" onclick="switchGame('task')">
      <span>🚨 3. 紧急任务</span>
      <span class="btn-en">Missions</span>
    </button>
    <button class="comic-btn btn-game" id="tab-theater" onclick="switchGame('theater')">
      <span>💬 4. 情景剧场</span>
      <span class="btn-en">Role-Play</span>
    </button>
    <button class="comic-btn btn-game" id="tab-memory" onclick="switchGame('memory')">
      <span>🃏 5. 徽章翻翻乐</span>
      <span class="btn-en">Memory Match</span>
    </button>
  </div>

  <!-- 漫画对话框提示区 -->
  <div class="speech-bubble" id="prompt-box">
    <div class="prompt-text" id="prompt-main"></div>
    <div class="prompt-sub" id="prompt-sub"></div>
    <div class="audio-controls">
      <button class="speak-btn" id="speak-btn" style="display:none;" onclick="replayAudio()">
        🔊 再听一遍 (Listen Again)
      </button>
      <button class="speed-btn active" id="speed-slow" onclick="setSpeed(0.62)">
        🐢 慢速朗读 (Slow)
      </button>
      <button class="speed-btn" id="speed-normal" onclick="setSpeed(0.85)">
        🐇 正常语速 (Normal)
      </button>
    </div>
  </div>

  <!-- 情景剧场舞台（仅第4关显示） -->
  <div id="theater-container" style="display:none;"></div>

  <!-- 游戏主卡片区 -->
  <div class="grid" id="game-grid"></div>

  <!-- 反馈栏 -->
  <div class="feedback" id="feedback"></div>
</div>

<script>
const vocab = [
  {
    id: 1,
    hanzi: "建筑工人",
    ruby: "<ruby>建<rt>jiàn</rt>筑<rt>zhù</rt>工<rt>gōng</rt>人<rt>rén</rt></ruby>",
    en: "Construction Worker",
    emoji: "👷‍♂️",
    actionPlain: "盖房子",
    actionRuby: "<ruby>盖<rt>gài</rt>房<rt>fáng</rt>子<rt>zi</rt></ruby>",

let currentMode = 'home';
let currentGame = 'learn';
let targetItem = null;
let scores = { red: 0, blue: 0 };
let currentSpeakText = "";
let speechRate = 0.62;

function setSpeed(rate) {
  speechRate = rate;
  document.getElementById('speed-slow').classList.toggle('active', rate === 0.62);
  document.getElementById('speed-normal').classList.toggle('active', rate === 0.85);
  if (currentSpeakText) speak(currentSpeakText);
}

// 语音朗读（兼容 iOS Safari / Android / 桌面浏览器）
function speak(text) {
  currentSpeakText = text;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = speechRate;

    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh'));
    if (zhVoice) {
      utter.voice = zhVoice;
    }

    window.speechSynthesis.speak(utter);
  } catch (e) {
    console.warn('Speech synthesis unavailable:', e);
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

function replayAudio() {
  if (currentSpeakText) speak(currentSpeakText);
}

// 彩带庆祝动画
function launchConfetti() {
  const colors = ['#ff1744', '#ffd600', '#00c853', '#29b6f6', '#aa00ff'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (Math.random() * 1.2 + 1) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-home').classList.toggle('active', mode === 'home');
  document.getElementById('mode-class').classList.toggle('active', mode === 'class');
  document.getElementById('scoreboard').style.display = (mode === 'class') ? 'flex' : 'none';
}

function addScore(team, pts) {
  scores[team] += pts;
  document.getElementById(`score-${team}`).innerText = scores[team];
  launchConfetti();
}

function switchGame(game) {
  currentGame = game;
  document.querySelectorAll('.btn-game').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${game}`).classList.add('active');
  document.getElementById('feedback').innerHTML = "";
  document.getElementById('speak-btn').style.display = 'none';
  document.getElementById('theater-container').style.display = 'none';

  if (game === 'learn') initLearn();
  else if (game === 'listen') initListen();
  else if (game === 'task') initTask();
  else if (game === 'theater') initTheater();
  else if (game === 'memory') initMemory();
}

let flippedCards = [];
let matchedCount = 0;

function initMemory() {
  document.getElementById('prompt-main').innerHTML =

  document.getElementById('prompt-sub').innerText = "Flip two cards to match the hero badge with the Chinese word!";
  flippedCards = [];
  matchedCount = 0;

  let selected = [...vocab].sort(() => Math.random() - 0.5).slice(0, 6);
  let deck = [];
  selected.forEach(item => {
    deck.push({ pairId: item.id, type: 'emoji', content: `<div class="emoji-badge" style="width:54px;height:54px;font-size:1.9rem;margin:0 0 4px;">${item.emoji}</div><div class="en">${item.en}</div>`, item: item });
    deck.push({ pairId: item.id, type: 'text', content: `<div class="hanzi-ruby">${item.ruby}</div>`, item: item });
  });
  deck.sort(() => Math.random() - 0.5);

  const grid = document.getElementById('game-grid');
  grid.innerHTML = '';
  deck.forEach(cardData => {
    const card = document.createElement('div');
    card.className = 'card memory-card';
    card.innerHTML = `<div class="cover">⚡</div><div class="content">${cardData.content}</div>`;
    card.onclick = () => flipCard(card, cardData);
    grid.appendChild(card);
  });
}

function flipCard(card, data) {
  if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.querySelector('.cover').style.display = 'none';
  card.classList.add('flipped');
  speak(data.item.hanzi);
  flippedCards.push({ card, data });

  if (flippedCards.length === 2) {
    const [first, second] = flippedCards;
    if (first.data.pairId === second.data.pairId) {
      first.card.classList.add('matched');
      second.card.classList.add('matched');
      flippedCards = [];
      matchedCount++;
      document.getElementById('feedback').innerHTML =
        `✨ <ruby>配<rt>pèi</rt>对<rt>duì</rt>成<rt>chéng</rt>功<rt>gōng</rt></ruby>：${data.item.ruby}！
         <span class="feedback-en">Matched: ${data.item.en}!</span>`;
      if (matchedCount === 6) {
        launchConfetti();
        document.getElementById('feedback').innerHTML =
          `🏆 <ruby>恭<rt>gōng</rt>喜<rt>xǐ</rt>通<rt>tōng</rt>关<rt>guān</rt>！你<rt>nǐ</rt>太<rt>tài</rt>棒<rt>bàng</rt>了<rt>le</rt>！</ruby>
           <span class="feedback-en">Congratulations! All superheroes assembled!</span>
           <button class="comic-btn btn-game" style="margin-top:10px;" onclick="initMemory()"><span>🔄 再玩一次</span><span class="btn-en">Play Again</span></button>`;
        speak("恭喜通关，你太棒了！");
      }
    } else {
      setTimeout(() => {
        first.card.classList.remove('flipped');
        first.card.querySelector('.cover').style.display = 'flex';
        second.card.classList.remove('flipped');
        second.card.querySelector('.cover').style.display = 'flex';
        flippedCards = [];
      }, 1000);
    }
  }
}

initLearn();
</script>
</body>
</html>
